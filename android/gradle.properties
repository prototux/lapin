# Memory: the build machine has no swap and runs other things; keep Gradle small.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.daemon=false
# compile Kotlin inside the Gradle process (no separate Kotlin daemon)
kotlin.compiler.execution.strategy=in-process
org.gradle.java.installations.auto-download=false
# build.sh exports JAVA_HOME (a JDK 17-21): Gradle uses it as the toolchain
org.gradle.java.installations.fromEnv=JAVA_HOME
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
