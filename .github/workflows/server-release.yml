# Publishes the server's Docker image on its own, without the other parts,
# when a server tag is pushed:
#
#     git tag server-v1.3.1 && git push origin server-v1.3.1
#
# The image goes to ghcr.io/<owner>/lapin-server, tagged 1.3.1, 1.3 and
# latest (a pre-release, server-v1.3.1-rc1, gets only its own tag), with the
# Korvo firmware built from the same commit. No GitHub release is made: the
# image is the package (see docs/server.md, "Docker").
#
# Run it by hand (Actions > Server release > Run workflow) to build the image
# without pushing it.
name: Server release

on:
  push:
    tags: ["server-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp on the test build
        default: 0.0.0-dev

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - id: v
        env:
          INPUT: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          v=${INPUT#server-}
          v=${v#v}
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$' || { echo "bad version: $v"; exit 1; }
          {
            echo "version=$v"
            case "$v" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac
            echo "publish=${{ github.event_name == 'push' }}"
          } >> "$GITHUB_OUTPUT"
          echo "Version $v" >> "$GITHUB_STEP_SUMMARY"

  korvo:
    needs: version
    uses: ./.github/workflows/korvo-firmware.yml
    with:
      version: ${{ needs.version.outputs.version }}

  server-image:
    needs: [version, korvo]
    uses: ./.github/workflows/server-image.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.version.outputs.version }}
      prerelease: ${{ needs.version.outputs.prerelease }}
      publish: ${{ needs.version.outputs.publish }}
