# Builds the Android APK stamped with a version, signed with the release key
# when the repository has it (see docs/development.md, "One-time setup"), and
# keeps it as the run artifact `release-android`. Called by release.yml (the
# release of every part) and android-release.yml (the app on its own).
name: Android APK

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  apk:
    name: Android app
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/set_version.py "$VERSION"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Signed release APK
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LAPIN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LAPIN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LAPIN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export LAPIN_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$LAPIN_KEYSTORE"
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk "../out/lapin-android-$VERSION.apk"
          rm -f "$LAPIN_KEYSTORE"
      - name: Debug APK (no signing key in the secrets)
        if: env.HAS_KEY != 'true'
        working-directory: android
        run: |
          echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: publishing a debug-signed APK"
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk "../out/lapin-android-$VERSION-debug.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: out/*.apk
